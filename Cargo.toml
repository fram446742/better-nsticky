[package]

name = "better-nsticky"
version = "0.6.1"
edition = "2024"
# rust-version = "1.88"
description = "Sticky and staged window management for the niri Wayland compositor (better-nsticky fork)"
license = "BSD-3-Clause"
repository = "https://github.com/fram446742/better-nsticky"
readme = "README.md"
keywords = ["niri", "wayland", "sticky", "window-manager"]
categories = ["command-line-utilities"]

[[bin]]
name = "nsticky"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1"
regex = "1.13.1"
shell-words = "1.1.1"
dirs = "7.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
parking_lot = "0.13.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
