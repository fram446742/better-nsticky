version: 2

updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    groups:
      nix-deps:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    groups:
      cargo-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

    open-pull-requests-limit: 5

    groups:
      actions:
        patterns:
          - "*"
